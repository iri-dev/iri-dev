<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Inazuma night — torii, sakura and wisteria under a violet sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0E0620"/>
      <stop offset="42%" stop-color="#1C1039"/>
      <stop offset="78%" stop-color="#331C5C"/>
      <stop offset="100%" stop-color="#4A2A7A"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6D3FF" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#C9A7FF" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#C9A7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#8B5BD6" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#8B5BD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8BBFF" stop-opacity="0"/>
      <stop offset="55%" stop-color="#D8BBFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#D8BBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="farhill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1750"/><stop offset="100%" stop-color="#1B0F36"/>
    </linearGradient>
    <linearGradient id="nearhill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160C2B"/><stop offset="100%" stop-color="#0C0619"/>
    </linearGradient>
    <linearGradient id="vign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E0620" stop-opacity=".78"/>
      <stop offset="38%" stop-color="#0E0620" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#0E0620" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <rect width="1200" height="340" fill="url(#horizon)"/>

    <!-- stars -->
